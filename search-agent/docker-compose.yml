services:
  redis:
    image: redis:7.4.1-alpine
    container_name: search-agent-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    networks:
      - search-agent-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.16.0
    container_name: search-agent-elasticsearch
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9201:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    networks:
      - search-agent-network
    healthcheck:
      test:
        ["CMD-SHELL", "curl -f http://localhost:9200/_cluster/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    platform: linux/amd64
    container_name: search-agent-backend
    environment:
      - ELASTICSEARCH_HOST=http://elasticsearch:9200
      - REDIS_HOST=redis://redis:6379
      - VERTEX_PROJECT_ID=${VERTEX_PROJECT_ID:-xxx}
      - VERTEX_REGION=${VERTEX_REGION:-us-east5}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-opus-4-5@20251101}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/gcp-credentials.json
    ports:
      - "8001:8000"
    volumes:
      - ./backend:/app
      - ../data:/data
      - ~/.config/gcloud/application_default_credentials.json:/app/credentials/gcp-credentials.json:ro
    networks:
      - search-agent-network
    depends_on:
      elasticsearch:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: search-agent-frontend
    ports:
      - "3001:80"
    networks:
      - search-agent-network
    depends_on:
      - backend

volumes:
  es-data:
    driver: local
  redis-data:
    driver: local

networks:
  search-agent-network:
    driver: bridge
